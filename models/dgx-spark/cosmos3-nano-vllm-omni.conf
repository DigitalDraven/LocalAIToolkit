MODEL_ID="cosmos3-nano-vllm-omni"
MODEL_NAME="Cosmos 3 Nano — vLLM-Omni (Image + Video)"
ENABLED=1
PROFILE_ORDER=80
MODEL_NOTE="text-to-image; text-to-video; validated on DGX Spark"
BACKEND="vllm"

# Select the dedicated image/video interface after preparing the backend.
STARTUP_INTERFACE="cosmos-media-studio"

IMAGE="vllm/vllm-omni:cosmos3"
HF_MODEL="nvidia/Cosmos3-Nano"
VOLUME_PATH="$HOME/.cache/huggingface:/root/.cache/huggingface"

PORT=8000
HOST="0.0.0.0"
IPC_MODE="host"
GPU_MEMORY_UTILIZATION=0.45
MAX_MODEL_LEN=32768
RECOMMENDED_MAX_MODEL_LEN=32768
VALIDATED_MAX_MODEL_LENS=(32768)
NEEDS_HF_TOKEN=1

# Tested on DGX Spark: successful model init,
# one 512x512 text-to-image request, and one 256x256 text-to-video request.
VLLM_ARGS=(
  --omni
  --enable-layerwise-offload
  --no-guardrails
)
VLLM_PLUGINS=()
ENV_VARS=()
