MODEL_ID="gemma-4-e4b-mlx"
MODEL_NAME="Gemma 4 E4B MLX 4-bit"
ENABLED=1
PROFILE_ORDER=30
MODEL_MIN_DISK_GB=8
MODEL_DOWNLOAD_SIZE="~5.2 GB"
MODEL_NOTE="Gemma 4 MLX profile; Gemma 4 reasoning and tool-call arguments configured; E4B memory, inference, and multimodal behavior require device validation"
BACKEND="vllm-metal"
EXECUTION_MODE="native"
HF_MODEL="mlx-community/gemma-4-e4b-it-4bit"
HOST="127.0.0.1"
PORT=8000
GPU_MEMORY_UTILIZATION=0.50
MAX_MODEL_LEN=8192
RECOMMENDED_MAX_MODEL_LEN=8192
PROFILE_MAX_MODEL_LENS=(4096 8192)

# Gemma 4 model behavior / tool calling
# Runtime compatibility is expected from the Gemma 4 family but not yet
# independently validated on this Apple Silicon profile.
VLLM_ARGS=(
  --reasoning-parser gemma4
  --default-chat-template-kwargs '{"enable_thinking": true}'
  --enable-auto-tool-choice
  --tool-call-parser gemma4
)
