VALIDATED_MAX_MODEL_LENS=(65536)

TRUST_REMOTE_CODE=1
NEEDS_HF_TOKEN=1

VLLM_ARGS=(
  --trust-remote-code --tensor-parallel-size 1 --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser nemotron_v3
)

