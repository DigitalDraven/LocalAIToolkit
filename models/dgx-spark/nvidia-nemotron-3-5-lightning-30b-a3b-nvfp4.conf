MODEL_ID="nvidia-nemotron-3-5-lightning-30b-a3b-nvfp4"
MODEL_NAME="Nemotron 3.5 30B A3B NVFP4"
ENABLED=1
PROFILE_ORDER=30
MODEL_NOTE="general-purpose"
BACKEND="vllm"

IMAGE="nvcr.io/nvidia/vllm:26.09-py3"
HF_MODEL="nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
VOLUME_PATH="$HOME/.cache/huggingface:/root/.cache/huggingface"

PORT=8000
HOST="0.0.0.0"
SHM_SIZE="16g"
GPU_MEMORY_UTILIZATION=0.7
MAX_MODEL_LEN=65536
RECOMMENDED_MAX_MODEL_LEN=65536
VALIDATED_MAX_MODEL_LENS=(65536)

TRUST_REMOTE_CODE=1
NEEDS_HF_TOKEN=0

VLLM_ARGS=(
  --mamba-backend flashinfer --mamba-cache-mode align --enable-prefix-caching --max-num-batched-tokens 16384 --kv-cache-dtype fp8 --moe-backend marlin --load-format fastsafetensors --tensor-parallel-size 1 --reasoning-parser nemotron_v3 --enable-auto-tool-choice --tool-call-parser qwen3_xml --mamba-ssm-cache-dtype float16 --enable-mamba-cache-stochastic-rounding --mamba-cache-philox-rounds 5
)

# v2.5 runtime extensions (empty unless this model requires a plugin/runtime override)
VLLM_PLUGINS=()
ENV_VARS=()
