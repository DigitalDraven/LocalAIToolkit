MODEL_ID="gemma4-31b-it-nvfp4"
MODEL_NAME="Gemma 4 31B IT NVFP4"
ENABLED=1
PROFILE_ORDER=20
MODEL_NOTE="reasoning"
BACKEND="vllm"

IMAGE="nvcr.io/nvidia/vllm:26.09-py3"
HF_MODEL="nvidia/Gemma-4-31B-IT-NVFP4"
VOLUME_PATH="$HOME/.cache/huggingface:/root/.cache/huggingface"

PORT=8000
HOST="0.0.0.0"
SHM_SIZE="16g"
GPU_MEMORY_UTILIZATION=0.8
MAX_MODEL_LEN=262144
RECOMMENDED_MAX_MODEL_LEN=262144
VALIDATED_MAX_MODEL_LENS=(32768 65536 262144)

TRUST_REMOTE_CODE=1
NEEDS_HF_TOKEN=1

VLLM_ARGS=(
  --max-num-seqs 8 --load-format fastsafetensors --kv-cache-dtype fp8 --tensor-parallel-size 1 --default-chat-template-kwargs '{"enable_thinking": true}' --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4
)

# v2.5 runtime extensions (empty unless this model requires a plugin/runtime override)
VLLM_PLUGINS=()
ENV_VARS=()
