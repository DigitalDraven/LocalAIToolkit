MODEL_ID="nvidia-nemotron-3-super-120b-a12b-nvfp4"
MODEL_NAME="Nemotron 3 Super 120B"
ENABLED=1
PROFILE_ORDER=60
MODEL_NOTE="general-purpose"
BACKEND="vllm"

IMAGE="nvcr.io/nvidia/vllm:26.09-py3"
HF_MODEL="unsloth/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
VOLUME_PATH="$HOME/.cache/huggingface:/root/.cache/huggingface"

PORT=8000
HOST="0.0.0.0"
SHM_SIZE="16g"
GPU_MEMORY_UTILIZATION=0.8
MAX_MODEL_LEN=65536
