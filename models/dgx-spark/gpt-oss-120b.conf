MODEL_ID="gpt-oss-120b"
MODEL_NAME="GPT OSS 120B"
ENABLED=1
PROFILE_ORDER=40
MODEL_NOTE="general-purpose"
BACKEND="vllm"

IMAGE="nvcr.io/nvidia/vllm:26.09-py3"
HF_MODEL="openai/gpt-oss-120b"
VOLUME_PATH="$HOME/.cache/huggingface:/root/.cache/huggingface"

PORT=8000
HOST="0.0.0.0"
SHM_SIZE="16g"
GPU_MEMORY_UTILIZATION=0.85
MAX_MODEL_LEN=32768
RECOMMENDED_MAX_MODEL_LEN=32768
VALIDATED_MAX_MODEL_LENS=(32768)

TRUST_REMOTE_CODE=1
NEEDS_HF_TOKEN=1

VLLM_ARGS=(
  --quantization mxfp4 --moe-backend marlin --attention-backend TRITON_ATTN --max-num-seqs 1 --max-num-batched-tokens 4096 --enable-chunked-prefill
)

# v2.5 runtime extensions (empty unless this model requires a plugin/runtime override)
VLLM_PLUGINS=()
ENV_VARS=()
