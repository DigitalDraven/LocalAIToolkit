MODEL_ID="llama-4-scout-17b-16e-nvfp4"
MODEL_NAME="Llama 4 Scout 17B 16E NVFP4"
ENABLED=1
PROFILE_ORDER=70
MODEL_NOTE="general-purpose"
BACKEND="vllm"

IMAGE="nvcr.io/nvidia/vllm:26.09-py3"
HF_MODEL="nvidia/Llama-4-Scout-17B-16E-Instruct-NVFP4"
VOLUME_PATH="$HOME/.cache/huggingface:/root/.cache/huggingface"

PORT=8000
HOST="0.0.0.0"
SHM_SIZE="16g"
GPU_MEMORY_UTILIZATION=0.8
MAX_MODEL_LEN=65536
RECOMMENDED_MAX_MODEL_LEN=65536
VALIDATED_MAX_MODEL_LENS=(65536)

TRUST_REMOTE_CODE=1
NEEDS_HF_TOKEN=1

VLLM_ARGS=(
  --kv-cache-dtype fp8 --tensor-parallel-size 1 --async-scheduling --no-enable-prefix-caching --max-num-batched-tokens 8192 --enable-auto-tool-choice --tool-call-parser llama4_pythonic --chat-template /opt/vllm/vllm-src/examples/tool_chat_template_llama4_pythonic.jinja --compilation-config '{"pass_config":{"fuse_allreduce_rms":true,"eliminate_noops":true}}'
)

